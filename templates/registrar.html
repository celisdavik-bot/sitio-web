<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registrarse</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome v4 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body { background: #f5f6fa; }
    .card-register {
      max-width: 480px;
      margin: 70px auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      background: #fff;
    }
    .form-control { border-radius: 8px; }
    .btn-primary { border-radius: 8px; }
    .small-muted { font-size: .9rem; color: #6c757d; }
  </style>
</head>
<body>

  <div class="card-register">
    <h3 class="text-center mb-3">Crear cuenta</h3>
    <p class="text-center small-muted">Completa los datos para registrarte</p>

    <div id="alert-placeholder" style="min-height: 40px;"></div>

    <form id="register-form" novalidate>
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-user"></i></span>
          <input type="text" name="name" id="name" class="form-control" required placeholder="Tu nombre completo">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-envelope"></i></span>
          <input type="email" name="email" id="email" class="form-control" required placeholder="correo@ejemplo.com">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-lock"></i></span>
          <input type="password" name="password" id="password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Repetir contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-lock"></i></span>
          <input type="password" name="password2" id="password2" class="form-control" required minlength="6" placeholder="Repite la contraseña">
        </div>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">Acepto los <a href="#">términos y condiciones</a></label>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submit-btn">
        <i class="fa fa-user-plus me-2"></i> Registrarme
      </button>

      <div class="mt-3 text-center small-muted">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById("register-form");
    const alertPlaceholder = document.getElementById("alert-placeholder");
    const submitBtn = document.getElementById("submit-btn");

    function showAlert(message, type = "danger") {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertPlaceholder.innerHTML = "";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      const terms = document.getElementById("terms").checked;

      // Validaciones cliente
      if (!name || !email || !password || !password2) {
        return showAlert("Completa todos los campos.", "warning");
      }
      if (password.length < 6) {
        return showAlert("La contraseña debe tener al menos 6 caracteres.", "warning");
      }
      if (password !== password2) {
        return showAlert("Las contraseñas no coinciden.", "warning");
      }
      if (!terms) {
        return showAlert("Debes aceptar los términos y condiciones.", "warning");
      }

      // Desactivar botón mientras se procesa
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Registrando...';

      try {
        // Enviamos como form-encoded para compatibilidad con tu endpoint actual
        const formData = new URLSearchParams();
        formData.append("email", email);
        formData.append("password", password);
        formData.append("name", name);

        const res = await fetch("/register", {
          method: "POST",
          headers: { "Accept": "application/json", "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const msg = data.error || data.msg || "Error al registrarse.";
          showAlert(msg, "danger");
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa fa-user-plus me-2"></i> Registrarme';
          return;
        }

        // Éxito
        showAlert("Registrado correctamente. Redirigiendo...", "success");
        // esperar 1s y redirigir a login o al index
        setTimeout(() => {
          window.location.href = "/login";
        }, 900);

      } catch (err) {
        showAlert("Error de conexión. Intenta otra vez.", "danger");
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa fa-user-plus me-2"></i> Registrarme';
      }
    });
  </script>
</body>
</html>
